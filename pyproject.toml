[project]
name = "issue-triage-copilot"
version = "0.1.0"
description = "An AI copilot that recommends next actions for open-source issue triage."
requires-python = ">=3.11"
dependencies = [
    "langchain>=0.3",
    "langgraph>=0.2",
    "langchain-openai>=0.2",
    "langchain-mcp-adapters>=0.1",
    "mcp>=1.0",
    "openai>=1.0",
    "pydantic>=2.0",
    "chromadb>=0.5",
    "tiktoken>=0.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["triage/tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["triage"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
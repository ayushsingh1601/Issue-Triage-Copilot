# Template for Streamlit Community Cloud secrets.
# Copy into your app's Settings -> Secrets on share.streamlit.io (or a local
# .streamlit/secrets.toml). Never commit real secrets to git.

# Required — LLM + embeddings
OPENAI_API_KEY = "sk-..."

# Required — GitHub API (fetch + index repos on demand)
GITHUB_TOKEN = "ghp_..."

# Optional — hosted traces (already wired via triage/observability.py)
LANGFUSE_PUBLIC_KEY = "pk-lf-..."
LANGFUSE_SECRET_KEY = "sk-lf-..."
LANGFUSE_BASE_URL = "https://cloud.langfuse.com"

# Optional — overrides
# OPENAI_MAIN_MODEL = "gpt-4o-mini"
# OPENAI_FAST_MODEL = "gpt-4o-mini"
# EVAL_REPO = "scikit-learn/scikit-learn"
# MAX_ISSUES = "500"